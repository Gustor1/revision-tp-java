<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision TP Java</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1d1b; --muted:#66645e; --line:#e2dfd6;
  --accent:#b4451f; --accent-soft:#f7e6dd; --ok:#1f7a4a; --ok-soft:#e1f2e8; --ko:#b3261e; --ko-soft:#fbe4e2;
  --code-bg:#1f2329; --code-ink:#e6e6e6; --kw:#ff9e64; --str:#9ece6a; --com:#7a8394; --num:#e0af68; --ann:#bb9af7;
  --hint:#fff6d8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171a; --panel:#1f2125; --ink:#ecebe6; --muted:#a19e96; --line:#33353b;
    --accent:#ff8a5c; --accent-soft:#3a2a22; --ok:#5fd394; --ok-soft:#1d3327; --ko:#ff8a80; --ko-soft:#3d2120;
    --code-bg:#121417; --hint:#3a351f; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
code,pre,.blank,textarea.out{font-family:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
main{min-width:0}
p code, li code, .fp code, td code{overflow-wrap:anywhere}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:17px;margin:0 0 2px}
nav .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
nav a{display:block;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:8px;font-size:14.5px}
nav a:hover{background:var(--accent-soft)}
nav a.active{background:var(--accent);color:#fff}
nav .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 10px 4px}
nav .bar{height:4px;background:var(--line);border-radius:3px;margin:3px 0 0;overflow:hidden}
nav .bar i{display:block;height:100%;background:var(--ok)}
nav a.active .bar{background:rgba(255,255,255,.35)} nav a.active .bar i{background:#fff}
main{padding:28px 36px 80px;max-width:980px;width:100%}
.menu-btn{display:none}
h2{font-size:28px;margin:0 0 6px;line-height:1.2}
h3{font-size:19px;margin:26px 0 8px}
.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-right:6px}
.pill.gray{background:var(--line);color:var(--muted)}
.stars{color:var(--accent);letter-spacing:1px;font-size:13px}
pre.code{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.6;margin:10px 0;tab-size:4}
.kw{color:var(--kw)} .st{color:var(--str)} .cm{color:var(--com);font-style:italic} .nu{color:var(--num)} .an{color:var(--ann)}
p code, li code, .fp code, td code{background:var(--accent-soft);padding:1px 5px;border-radius:5px;font-size:.9em}
.fiche h4{margin:16px 0 4px;font-size:16px}
.fiche .fp{margin:0 0 6px}
details.fiche-box>summary{cursor:pointer;font-weight:600;font-size:17px}
input.blank{background:#2b3038;color:#fff;border:1px dashed #8a93a3;border-radius:5px;padding:1px 4px;font-size:14px;min-width:3ch}
input.blank:focus{outline:2px solid var(--kw);border-style:solid}
input.blank.ok{background:#1f4d33;border:1px solid #5fd394}
input.blank.ko{background:#5a2420;border:1px solid #ff8a80}
.exo{scroll-margin-top:20px}
.exo-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
.exo-head h4{margin:0;font-size:17px;flex:1 1 260px}
.status{font-size:13px;font-weight:700}
.status.ok{color:var(--ok)} .status.ko{color:var(--ko)}
.consigne{white-space:pre-wrap;margin:4px 0 8px}
.consigne.mono{font-family:ui-monospace,Consolas,monospace;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
details.ctx{margin:6px 0} details.ctx summary{cursor:pointer;color:var(--muted);font-size:14px}
.opts{display:grid;gap:7px;margin:8px 0}
.opts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer;background:var(--panel)}
.opts label:hover{border-color:var(--accent)}
.opts label.ok{background:var(--ok-soft);border-color:var(--ok)}
.opts label.ko{background:var(--ko-soft);border-color:var(--ko)}
.opts input{margin-top:4px;accent-color:var(--accent)}
textarea.out{width:100%;min-height:110px;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;background:var(--bg);color:var(--ink)}
textarea.out.ok{border-color:var(--ok);background:var(--ok-soft)} textarea.out.ko{border-color:var(--ko);background:var(--ko-soft)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.feedback{margin-top:10px;border-radius:9px;padding:10px 13px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.feedback.ko{background:var(--ko-soft);border-left:4px solid var(--ko)}
.feedback.info{background:var(--hint);border-left:4px solid var(--num)}
.expected{white-space:pre;font-family:ui-monospace,Consolas,monospace;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:6px 0;overflow:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);text-align:left;padding:8px 6px;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
.big{font-size:34px;font-weight:700;color:var(--accent)}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;border-bottom:1px dashed var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.tick{color:var(--ok);font-weight:700} .miss{color:var(--ko);font-weight:700}
.print-only{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;inset:0 25% 0 0;z-index:10;transform:translateX(-105%);transition:transform .2s;height:100vh;box-shadow:0 0 30px rgba(0,0,0,.3)}
  nav.open{transform:none}
  main{padding:16px 16px 70px}
  .menu-btn{display:inline-block;position:sticky;top:8px;z-index:5;margin-bottom:10px}
  pre.code{font-size:12.5px;padding:12px}
}
@media (prefers-reduced-motion: reduce){ nav{transition:none} }
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  nav,.menu-btn,.btns,.filters,.no-print,.feedback{display:none!important}
  .layout{display:block} main{padding:0;max-width:none}
  .card{border:1px solid #999;break-inside:avoid;page-break-inside:avoid}
  pre.code{background:#fff;color:#000;border:1px solid #999;white-space:pre-wrap}
  .kw,.st,.cm,.nu,.an{color:#000}
  input.blank{background:#fff;border:none;border-bottom:1px solid #000;border-radius:0;color:transparent}
  body.corrige input.blank{color:#000;font-weight:700}
  body.corrige .feedback.expl{display:block!important;background:#fff;border-left:3px solid #000}
  textarea.out{min-height:120px;background:#fff;color:transparent;border:1px solid #000}
  body.corrige textarea.out{color:#000}
  .opts label{border:none;padding:2px 0}
  .print-only{display:block}
}
</style>
</head>
<body>
<div class="layout">
  <nav id="nav" aria-label="Sommaire"></nav>
  <main id="main">
    <button class="menu-btn" onclick="document.getElementById('nav').classList.toggle('open')" aria-label="Ouvrir le menu">☰ Menu</button>
    <div id="view"></div>
  </main>
</div>
<script src="data.js"></script>
<script>
const CH = window.CHAPITRES, EXOS = window.EXOS, PAT = window.PATTERNS;
const TYPES = { trous: "Texte à trous", sortie: "Qu'affiche ce code ?", qcm: "QCM", multi: "QCM multiple" };
const KEY = "pr70-revision-v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { progress = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }

/* ---------- utilitaires ---------- */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const KW = "abstract|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|null|package|private|protected|public|return|short|static|super|switch|this|throw|throws|true|false|try|void|while|var";
const TOK = new RegExp('(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|(@\\w+)|\\b(' + KW + ')\\b|\\b(\\d+(?:\\.\\d+)?)\\b', 'g');
function hl(code) {
  let out = "", last = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "cm" : m[2] ? "st" : m[3] ? "an" : m[4] ? "kw" : "nu";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    last = TOK.lastIndex;
  }
  return out + esc(code.slice(last));
}
function inline(t) { // texte de fiche : ‹code› et **gras**
  return esc(t).replace(/‹(.*?)›/g, "<code>$1</code>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
}
const normCode = s => s.replace(/\s+/g, "").replace(/;+$/, "");
const normOut = s => s.replace(/\r/g, "").split("\n").map(l => l.trim().replace(/\s+/g, " ")).filter(l => l).join("\n");
const chOf = id => CH.find(c => c.id === id);
const stars = n => "★".repeat(n) + "☆".repeat(3 - n);
function chStats(chId) {
  const list = EXOS.filter(e => e.ch === chId);
  const ok = list.filter(e => progress[e.id] === "ok").length;
  return { total: list.length, ok, done: list.filter(e => progress[e.id]).length };
}

/* ---------- navigation ---------- */
function renderNav(active) {
  let h = '<h1>Révision TP Java</h1><div class="sub">PR70 · évaluation papier</div>';
  const link = (href, label, extra = "") => '<a href="#' + href + '" class="' + (active === href ? "active" : "") + '">' + label + extra + "</a>";
  h += link("accueil", "🏠 Accueil & méthode");
  h += link("patterns", "🔁 Ce qui retombe le plus");
  h += '<div class="grp">Parcours (dans l\'ordre des TP)</div>';
  CH.forEach(c => {
    const s = chStats(c.id);
    h += link(c.id, c.num + ". " + c.titre, '<div class="bar"><i style="width:' + (100 * s.ok / s.total) + '%"></i></div>');
  });
  h += '<div class="grp">S\'entraîner</div>';
  h += link("examen", "📝 Examen blanc (imprimable)");
  h += link("erreurs", "🔄 Revoir mes erreurs");
  h += link("couverture", "✅ Couverture des TP");
  document.getElementById("nav").innerHTML = h;
}

/* ---------- rendu d'un exercice ---------- */
function codeWithBlanks(code, exoId) {
  let i = 0;
  return code.split(/(«[^»]*»)/).map(part => {
    if (part.startsWith("«")) {
      const alts = part.slice(1, -1).split("¦");
      const w = Math.max(3, ...alts.map(a => a.length)) + 1;
      return '<input class="blank" data-i="' + (i++) + '" data-ans="' + esc(alts.join("¦")) + '" style="width:' + w + 'ch" aria-label="trou ' + i + '" autocomplete="off" spellcheck="false">';
    }
    return hl(part);
  }).join("");
}
function exoHTML(e, num) {
  const c = chOf(e.ch);
  const st = progress[e.id];
  let h = '<article class="card exo" id="exo-' + e.id + '" data-id="' + e.id + '">';
  h += '<div class="exo-head">' + (num ? "<strong>" + num + ".</strong>" : "") + "<h4>" + esc(e.titre) + "</h4>";
  h += '<span class="pill">' + TYPES[e.type] + '</span><span class="pill gray">' + c.tp + '</span><span class="stars" title="niveau ' + e.niveau + '">' + stars(e.niveau) + "</span>";
  h += '<span class="status ' + (st || "") + '">' + (st === "ok" ? "✔ réussi" : st === "ko" ? "✘ à revoir" : "") + "</span></div>";
  if (e.consigne) {
    const mono = (e.type === "qcm" || e.type === "multi") && /[;{}]/.test(e.consigne);
    h += '<div class="consigne' + (mono ? " mono" : "") + '">' + esc(e.consigne) + "</div>";
  } else if (e.type === "sortie") h += '<div class="consigne">Écrivez exactement ce que ce code affiche (une ligne par println).</div>';
  else if (e.type === "trous") h += '<div class="consigne">Complétez les trous.</div>';
  if (e.avant) h += '<details class="ctx no-print"><summary>Code déjà fourni autour (contexte)</summary><pre class="code">' + hl(e.avant + (e.apres ? "\n    /* ... votre code ... */\n" + e.apres : "")) + "</pre></details>";
  if (e.type === "trous") h += '<pre class="code">' + codeWithBlanks(e.code) + "</pre>";
  if (e.type === "sortie") h += '<pre class="code">' + hl(e.code) + '</pre><label class="no-print" style="font-size:14px;color:var(--muted)">Votre réponse :</label><textarea class="out" spellcheck="false" aria-label="Sortie attendue"></textarea>';
  if (e.type === "qcm" || e.type === "multi") {
    h += '<div class="opts">' + e.options.map((o, i) => '<label><input type="' + (e.type === "qcm" ? "radio" : "checkbox") + '" name="q-' + e.id + '" value="' + i + '"><span>' + esc(o) + "</span></label>").join("") + "</div>";
  }
  h += '<div class="btns"><button class="primary" data-act="check">Vérifier</button><button data-act="show">Voir la correction</button><button data-act="reset">Recommencer</button></div>';
  h += '<div class="feedback res"></div><div class="feedback info expl"><strong>Explication.</strong> ' + esc(e.explication) + "</div>";
  return h + "</article>";
}
function setStatus(art, e, ok) {
  progress[e.id] = ok ? "ok" : "ko"; save();
  const s = art.querySelector(".status");
  s.className = "status " + progress[e.id]; s.textContent = ok ? "✔ réussi" : "✘ à revoir";
  if (window.onExoChecked) window.onExoChecked();
  renderNav(currentRoute);
}
function checkExo(art, reveal) {
  const e = EXOS.find(x => x.id === art.dataset.id);
  const res = art.querySelector(".res"), expl = art.querySelector(".expl");
  let ok = false, msg = "";
  if (e.type === "trous") {
    const ins = [...art.querySelectorAll("input.blank")];
    let good = 0;
    ins.forEach(inp => {
      const alts = inp.dataset.ans.split("¦");
      if (reveal) { inp.value = alts[0]; }
      const g = alts.some(a => normCode(a) === normCode(inp.value));
      inp.classList.toggle("ok", g); inp.classList.toggle("ko", !g);
      if (g) good++;
    });
    ok = good === ins.length;
    msg = ok ? "Bravo, tous les trous sont justes." : good + " / " + ins.length + " trous justes. Les cases rouges sont à corriger.";
  } else if (e.type === "sortie") {
    const ta = art.querySelector("textarea.out");
    ok = normOut(ta.value) === normOut(e.reponse);
    ta.classList.toggle("ok", ok); ta.classList.toggle("ko", !ok);
    msg = (ok ? "Exact." : "Pas tout à fait. ") + ' Sortie attendue :<div class="expected">' + esc(e.reponse) + "</div>";
    if (reveal) { ta.value = e.reponse; ta.classList.remove("ko"); }
  } else {
    const labels = [...art.querySelectorAll(".opts label")];
    const good = e.type === "qcm" ? [e.bonne] : e.bonnes;
    const chosen = labels.map((l, i) => l.querySelector("input").checked ? i : -1).filter(i => i >= 0);
    labels.forEach((l, i) => {
      l.classList.remove("ok", "ko");
      if (good.includes(i)) l.classList.add("ok");
      else if (chosen.includes(i)) l.classList.add("ko");
      if (reveal) l.querySelector("input").checked = good.includes(i);
    });
    ok = chosen.length === good.length && chosen.every(i => good.includes(i));
    msg = ok ? "Bonne réponse." : (chosen.length ? "Ce n'est pas ça : les bonnes réponses sont en vert." : "Choisissez une réponse. Les bonnes réponses sont en vert.");
  }
  if (reveal) { res.className = "feedback res show info"; res.innerHTML = e.type === "sortie" ? 'Sortie attendue :<div class="expected">' + esc(e.reponse) + "</div>" : "Correction affichée."; if (!progress[e.id]) setStatus(art, e, false); }
  else { res.className = "feedback res show " + (ok ? "ok" : "ko"); res.innerHTML = msg; setStatus(art, e, ok); }
  expl.classList.add("show");
}
function resetExo(art) {
  art.querySelectorAll("input.blank").forEach(i => { i.value = ""; i.classList.remove("ok", "ko"); });
  art.querySelectorAll("textarea.out").forEach(t => { t.value = ""; t.classList.remove("ok", "ko"); });
  art.querySelectorAll(".opts label").forEach(l => { l.classList.remove("ok", "ko"); l.querySelector("input").checked = false; });
  art.querySelectorAll(".feedback").forEach(f => f.classList.remove("show"));
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-act]"); if (!b) return;
  const art = b.closest(".exo");
  if (b.dataset.act === "check") checkExo(art, false);
  if (b.dataset.act === "show") checkExo(art, true);
  if (b.dataset.act === "reset") resetExo(art);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches("input.blank")) { ev.preventDefault(); checkExo(ev.target.closest(".exo"), false); }
});

/* ---------- pages ---------- */
function pageAccueil() {
  const total = EXOS.length, ok = EXOS.filter(e => progress[e.id] === "ok").length, ko = EXOS.filter(e => progress[e.id] === "ko").length;
  let h = "<h2>Préparer l'évaluation de TP Java (sur papier)</h2>";
  h += '<p class="lead">D\'après la prof : l\'épreuve porte sur <strong>tous les TP</strong> et demande de <strong>comprendre du code</strong> (lecture) et de <strong>compléter des textes à trous</strong>. Le site est construit exactement sur ces deux formats, à partir de vos 7 sujets de TP et des 4 cours.</p>';
  h += '<div class="grid2"><div class="card"><div class="big">' + total + '</div>exercices corrigés et expliqués</div><div class="card"><div class="big">' + ok + '</div>réussis</div><div class="card"><div class="big">' + ko + '</div>à revoir</div></div>';
  h += "<h3>Le parcours conseillé</h3><ol class='steps'>";
  h += "<li><strong>Chapitre par chapitre, dans l'ordre des TP</strong> (menu de gauche) : c'est aussi l'ordre de difficulté, chaque TP réutilise le précédent.</li>";
  h += "<li>Dans chaque chapitre : lisez la <strong>fiche</strong> (5-10 min), puis faites les exercices <span class='stars'>★☆☆</span> → <span class='stars'>★★☆</span> → <span class='stars'>★★★</span> avec les filtres.</li>";
  h += "<li>Faites la page <a href='#patterns'>« Ce qui retombe le plus »</a> : les 14 morceaux de code qu'on retrouve dans plusieurs TP. Si vous savez les écrire de mémoire, vous savez remplir la plupart des trous.</li>";
  h += "<li>Faites un <a href='#examen'>examen blanc</a> : de préférence <strong>imprimé</strong> et fait au stylo, pour être dans les conditions réelles. Le corrigé s'imprime à part.</li>";
  h += "<li>Terminez par <a href='#erreurs'>« Revoir mes erreurs »</a> jusqu'à ce que la liste soit vide.</li></ol>";
  h += "<h3>Méthode pour l'épreuve papier</h3><div class='card'><ul>";
  h += "<li><strong>« Qu'affiche ce code ? »</strong> : faites un petit tableau avec une colonne par variable et réécrivez les valeurs à chaque ligne. N'essayez pas de deviner de tête.</li>";
  h += "<li>Les pièges qui reviennent : division entière <code>7/2 = 3</code>, <code>==</code> contre <code>equals</code>, concaténation <code>\"a\" + 1 + 2</code>, <code>finally</code> toujours exécuté, ligne sautée après un <code>throw</code>, TreeSet qui refuse un « doublon » quand <code>compare</code> renvoie 0, <code>super(...)</code> exécuté en premier, liaison dynamique (c'est le type <em>réel</em> qui décide).</li>";
  h += "<li><strong>Texte à trous</strong> : regardez d'abord ce qui est <em>autour</em> du trou. Après <code>class X</code> → <code>extends</code>/<code>implements</code>. Dans une signature → <code>throws</code>. Dans un corps → <code>throw new</code>. Première ligne d'un constructeur de sous-classe → <code>super(...)</code>. Un type entre <code>&lt; &gt;</code> → la classe des éléments.</li>";
  h += "<li>Écrivez proprement les majuscules : Java est sensible à la casse (<code>String</code>, <code>ArrayList</code>, <code>getText()</code>, <code>setVisible(true)</code>).</li>";
  h += "<li>Sur ce site, les réponses aux trous sont comparées <em>sans tenir compte des espaces</em>. Pour la sortie, une ligne par <code>println</code>.</li></ul></div>";
  h += "<h3>Les 8 chapitres</h3><div class='grid2'>" + CH.map(c => { const s = chStats(c.id); return "<a class='card' style='text-decoration:none;color:inherit;margin:0' href='#" + c.id + "'><span class='pill'>" + c.tp + "</span><br><strong>" + c.num + ". " + esc(c.titre) + "</strong><br><span style='color:var(--muted);font-size:14px'>" + s.ok + " / " + s.total + " réussis</span></a>"; }).join("") + "</div>";
  h += "<p class='no-print' style='margin-top:26px;font-size:13px;color:var(--muted)'>Votre progression est enregistrée dans ce navigateur. <button onclick=\"if(confirm('Effacer toute la progression ?')){progress={};save();route();}\">Remettre à zéro</button></p>";
  return h;
}
let filt = { niveau: 0, type: "" };
function pageChapitre(c) {
  const s = chStats(c.id);
  let h = '<span class="pill">' + c.tp + "</span><h2>" + c.num + ". " + esc(c.titre) + '</h2><p class="lead">Sources : ' + esc(c.sources) + " · " + s.ok + " / " + s.total + " exercices réussis</p>";
  h += '<details class="card fiche-box" open><summary>📄 Fiche de cours du chapitre</summary><div class="fiche">';
  c.fiche.forEach(f => { h += "<h4>" + esc(f.h) + '</h4><p class="fp">' + inline(f.p) + "</p>" + (f.code ? '<pre class="code">' + hl(f.code) + "</pre>" : ""); });
  h += "</div></details>";
  h += '<h3>Exercices</h3><div class="filters no-print"><span style="font-size:14px;color:var(--muted)">Niveau :</span>';
  [0, 1, 2, 3].forEach(n => h += '<button data-fn="' + n + '" class="' + (filt.niveau === n ? "on" : "") + '">' + (n ? stars(n) : "Tous") + "</button>");
  h += '<span style="font-size:14px;color:var(--muted);margin-left:8px">Type :</span>';
  [["", "Tous"], ["trous", "Trous"], ["sortie", "Sortie"], ["qcm", "QCM"]].forEach(([t, l]) => h += '<button data-ft="' + t + '" class="' + (filt.type === t ? "on" : "") + '">' + l + "</button>");
  h += "</div>";
  const list = EXOS.filter(e => e.ch === c.id).sort((a, b) => a.niveau - b.niveau)
    .filter(e => (!filt.niveau || e.niveau === filt.niveau) && (!filt.type || e.type === filt.type || (filt.type === "qcm" && e.type === "multi")));
  h += list.length ? list.map((e, i) => exoHTML(e, i + 1)).join("") : "<p>Aucun exercice pour ce filtre.</p>";
  const idx = CH.indexOf(c);
  h += '<div class="btns no-print" style="justify-content:space-between">' + (idx > 0 ? '<a href="#' + CH[idx - 1].id + '">← ' + esc(CH[idx - 1].titre) + "</a>" : "<span></span>") + (idx < CH.length - 1 ? '<a href="#' + CH[idx + 1].id + '">' + esc(CH[idx + 1].titre) + " →</a>" : '<a href="#examen">Examen blanc →</a>') + "</div>";
  return h;
}
document.addEventListener("click", ev => {
  const n = ev.target.closest("button[data-fn]"), t = ev.target.closest("button[data-ft]");
  if (n) { filt.niveau = +n.dataset.fn; route(); }
  if (t) { filt.type = t.dataset.ft; route(); }
});
function pagePatterns() {
  let h = "<h2>Ce qui retombe le plus</h2><p class='lead'>Les morceaux de code présents dans plusieurs TP, classés à partir des 7 sujets. Entraînez-vous à les réécrire sur papier sans regarder.</p>";
  PAT.forEach((p, i) => { h += '<div class="card"><strong>' + (i + 1) + ". " + esc(p.n) + '</strong> <span class="pill gray">' + esc(p.ou) + '</span><pre class="code">' + hl(p.code) + "</pre></div>"; });
  return h;
}
let examen = null;
function pageExamen() {
  let h = "<h2>Examen blanc</h2><p class='lead'>Un sujet tiré au hasard dans les chapitres choisis, mélangeant lecture de code, textes à trous et QCM. À faire en ligne ou à imprimer.</p>";
  h += '<div class="card no-print"><div style="display:flex;flex-wrap:wrap;gap:10px 18px">' + CH.map(c => '<label><input type="checkbox" class="exch" value="' + c.id + '" checked> ' + c.num + ". " + esc(c.tp) + "</label>").join("") + "</div>";
  h += '<div class="btns"><label>Nombre de questions <select id="exn"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></label><button class="primary" id="gen">Générer un sujet</button></div></div>';
  if (examen) {
    h += '<div class="card no-print" id="exscore"></div><div class="btns no-print"><button class="primary" id="corrAll">Corriger tout</button><button id="prSujet">🖨 Imprimer le sujet</button><button id="prCorr">🖨 Imprimer le corrigé</button></div>';
    h += '<div class="print-only"><h3>Examen blanc – TP Java PR70</h3><p>Nom : ____________________ &nbsp;&nbsp; Durée conseillée : ' + (examen.length * 4) + " min</p></div>";
    h += examen.map((id, i) => exoHTML(EXOS.find(e => e.id === id), i + 1)).join("");
  }
  return h;
}
function bindExamen() {
  const g = document.getElementById("gen");
  if (g) g.onclick = () => {
    const chs = [...document.querySelectorAll(".exch:checked")].map(x => x.value);
    const n = +document.getElementById("exn").value;
    const pool = EXOS.filter(e => chs.includes(e.ch));
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    examen = pool.slice(0, n).sort((a, b) => CH.findIndex(c => c.id === a.ch) - CH.findIndex(c => c.id === b.ch)).map(e => e.id);
    route();
  };
  const ca = document.getElementById("corrAll");
  if (ca) {
    const upd = () => {
      const arts = [...document.querySelectorAll(".exo")];
      const ok = arts.filter(a => a.querySelector(".res.ok")).length, done = arts.filter(a => a.querySelector(".res.show")).length;
      document.getElementById("exscore").innerHTML = done ? "<span class='big'>" + ok + " / " + arts.length + "</span> &nbsp; soit " + Math.round(20 * ok / arts.length * 10) / 10 + " / 20" : "Répondez puis cliquez sur « Corriger tout ».";
    };
    window.onExoChecked = upd; upd();
    ca.onclick = () => { document.querySelectorAll(".exo").forEach(a => checkExo(a, false)); upd(); };
    document.getElementById("prSujet").onclick = () => { document.querySelectorAll(".exo").forEach(resetExo); document.body.classList.remove("corrige"); window.print(); };
    document.getElementById("prCorr").onclick = () => { document.querySelectorAll(".exo").forEach(a => checkExo(a, true)); document.body.classList.add("corrige"); window.print(); setTimeout(() => document.body.classList.remove("corrige"), 500); };
  }
}
function pageErreurs() {
  const list = EXOS.filter(e => progress[e.id] === "ko");
  let h = "<h2>Revoir mes erreurs</h2><p class='lead'>Les exercices ratés ou dont vous avez affiché la correction. Réussissez-les pour les faire sortir de la liste.</p>";
  return h + (list.length ? list.map((e, i) => exoHTML(e, i + 1)).join("") : "<div class='card'>Rien à revoir pour l'instant 🎉</div>");
}
const COUV = [
  ["TP1", "§1 Entrées/sorties, piège du buffer Scanner", ["c1-scanner", "c1-buffer-qcm"]],

  ["TP1", "§3 Chaînes : occurrences, voyelles, casse, == et pile/tas", ["c1-occ", "c1-voyelles", "c1-string-eq", "c1-ref", "c1-concat"]],

  ["Cours 2", "static, tableaux, structures de contrôle", ["c1-static", "c1-tab", "c1-calc"]],
  ["TP2", "§1 Entreprise : Personne/Salarie abstraite, calculerPaye", ["c2-salarie", "c2-technicien", "c2-paye-sortie", "c2-abstract-qcm"]],
  ["TP2", "§2 Université : interfaces, cours, laboratoire, sans doublon", ["c2-interfaces", "c2-interface-qcm", "c2-labo", "c4-set", "c2-compil-qcm"]],

  ["TP4", "JWindow / JDialog / JFrame, invokeLater, setVisible", ["c5-fenetre", "c5-visible-qcm", "c5-fenetres-qcm"]],
  ["TP4", "Layouts (Flow, Border, Grid, Card, GridBag)", ["c5-layout-qcm", "c5-layouts-multi"]],
  ["TP4", "Boutons, ActionListener, AbstractAction, calculatrice", ["c5-listener", "c5-action", "c5-clic-qcm", "c5-calc"]],
  ["TP4", "JComboBox, modèles de liste, JOptionPane, menus", ["c5-combo", "c5-model-qcm", "c5-tp-bug-qcm", "c5-optionpane-qcm", "c5-menu"]],
  ["TP5", "File, createNewFile, infos", ["c6-file-qcm", "c6-fileinfo"]],
  ["TP5", "Écrire (FileWriter, close, append) et lire (Scanner)", ["c6-ecrire", "c6-lire", "c6-append-qcm", "c6-close-qcm", "c6-notes"]],
  ["TP5", "JFileChooser", ["c6-chooser"]],
  ["TP6", "paintComponent, repère, lignes", ["c7-surface", "c7-lignes-qcm", "c7-repere-qcm", "c7-repaint-qcm"]],
  ["TP6", "Formes, couleurs, texte, image", ["c7-rect-qcm", "c7-boucle", "c7-formes", "c7-image"]],
  ["TP7", "Structure de graphe, lecture depuis un fichier", ["c8-graphe", "c8-fichier"]],
  ["TP7", "Algorithme du plus court chemin (code + exécution à la main)", ["c8-dijkstra", "c8-trace", "c8-ordre-qcm", "c8-negatif-qcm"]]
];
function pageCouverture() {
  let h = "<h2>Couverture des TP</h2><p class='lead'>Chaque partie des sujets de TP et les exercices qui l'entraînent. Les ✔ indiquent ce que vous avez déjà réussi.</p>";
  h += '<div class="card" style="overflow:auto"><table><tr><th>Source</th><th>Partie</th><th>Exercices</th></tr>';
  COUV.forEach(([src, part, ids]) => {
    h += "<tr><td><span class='pill gray'>" + src + "</span></td><td>" + esc(part) + "</td><td>" + ids.map(id => { const e = EXOS.find(x => x.id === id); if (!e) return "<span class='miss'>?" + id + "</span>"; const st = progress[id]; return "<a href='#" + e.ch + "' data-goto='" + id + "'>" + (st === "ok" ? "<span class='tick'>✔</span> " : st === "ko" ? "<span class='miss'>✘</span> " : "○ ") + esc(e.titre) + "</a>"; }).join("<br>") + "</td></tr>";
  });
  h += "</table></div>";
  const used = new Set(COUV.flatMap(r => r[2]));
  const orphan = EXOS.filter(e => !used.has(e.id));
  h += "<h3>Pas d'exercice dédié (à lire dans les fiches)</h3><div class='card'><ul>";
  h += "<li>TP4 : JTextArea, JEditorPane, JTextPane (seulement cités dans le sujet), détail de GridBagLayout et CardLayout, JWindow fermée avec Thread.sleep.</li>";
  h += "<li>TP6 : RenderingHints (anticrénelage) n'a qu'une ligne de fiche ; fillArc et fillRoundRect sont dans la fiche.</li>";
  h += "<li>Cours 2 : packages, Javadoc, classes internes, tests JUnit — notions de cours, absentes des sujets de TP.</li>";
  if (orphan.length) h += "<li>Exercices hors tableau : " + orphan.map(e => esc(e.id)).join(", ") + "</li>";
  h += "</ul></div>";
  h += "<h3>Répartition</h3><div class='card' style='overflow:auto'><table><tr><th>Chapitre</th><th>Trous</th><th>Sortie</th><th>QCM</th><th>Total</th></tr>" + CH.map(c => { const l = EXOS.filter(e => e.ch === c.id); const n = t => l.filter(e => t.includes(e.type)).length; return "<tr><td>" + c.num + ". " + esc(c.titre) + "</td><td>" + n(["trous"]) + "</td><td>" + n(["sortie"]) + "</td><td>" + n(["qcm", "multi"]) + "</td><td><strong>" + l.length + "</strong></td></tr>"; }).join("") + "</table></div>";
  return h;
}
document.addEventListener("click", ev => {
  const a = ev.target.closest("a[data-goto]"); if (!a) return;
  ev.preventDefault(); filt = { niveau: 0, type: "" };
  location.hash = a.getAttribute("href");
  setTimeout(() => { const el = document.getElementById("exo-" + a.dataset.goto); if (el) el.scrollIntoView(); }, 60);
});

/* ---------- routeur ---------- */
let currentRoute = "accueil";
function route() {
  const r = (location.hash || "#accueil").slice(1);
  if (r !== currentRoute) filt = { niveau: 0, type: "" };
  currentRoute = r; window.onExoChecked = null;
  const c = chOf(r);
  const v = document.getElementById("view");
  v.innerHTML = c ? pageChapitre(c) : r === "patterns" ? pagePatterns() : r === "examen" ? pageExamen() : r === "erreurs" ? pageErreurs() : r === "couverture" ? pageCouverture() : pageAccueil();
  if (r === "examen") bindExamen();
  renderNav(c ? c.id : ["patterns", "examen", "erreurs", "couverture"].includes(r) ? r : "accueil");
  document.getElementById("nav").classList.remove("open");
}
let lastHash = location.hash;
window.addEventListener("hashchange", () => { route(); if (location.hash !== lastHash) window.scrollTo(0, 0); lastHash = location.hash; });
route();
</script>
